<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mouseion</title>
  <link rel="stylesheet" href="css/style.css?v=17">
  <script>
    // Apply a signed-in user's saved theme before first paint (avoids a flash).
    // With no override, CSS follows the system's prefers-color-scheme.
    try {
      var u = JSON.parse(localStorage.getItem("mouseion.user") || "null");
      if (u && u.theme && u.theme !== "system") {
        document.documentElement.setAttribute("data-theme", u.theme);
      }
    } catch (e) {}
  </script>
</head>
<body>

  <!-- Language gate: shown before the site on first visit -->
  <div id="language-gate" class="gate" hidden>
    <div class="gate-inner">
      <svg class="logo gate-logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="currentColor"/></svg>
      <p class="gate-title" id="gate-title" data-i18n="chooseLanguage">Choose your language</p>
      <input id="lang-search" class="lang-search" type="search" autocomplete="off"
             data-i18n-placeholder="searchLanguages" placeholder="Search languages"
             aria-labelledby="gate-title">
      <div id="lang-list" class="lang-list" role="listbox" aria-labelledby="gate-title"></div>
      <p id="no-results" class="no-results" data-i18n="noResults" hidden>No languages found</p>
    </div>
  </div>

  <!-- Site -->
  <div id="site" hidden>
    <header class="topbar">
      <a href="#/home" class="brand" aria-label="Mouseion — home"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="currentColor"/></svg></a>
      <nav class="actions">
        <button id="lang-btn" class="btn btn-ghost" data-i18n-title="changeLanguage" title="Change language">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
          <span id="lang-btn-label"></span>
        </button>
        <button id="account-btn" class="btn btn-icon" data-i18n-title="account" data-i18n-aria="account" title="Account" aria-label="Account">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        </button>
      </nav>
    </header>

    <main>
      <!-- Home: world map + timeline/calendar side by side, then search + categories -->
      <section id="home">
        <div class="home-top">
          <div class="panel map-panel">
            <button type="button" id="map-expand" class="map-tool" data-i18n-title="expand" data-i18n-aria="expand" title="Expand" aria-label="Expand">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
            </button>
            <div class="map-marquee" aria-hidden="true">
              <div class="map-track" dir="ltr">
                <img class="map" src="assets/world-map.svg" alt="">
                <img class="map" src="assets/world-map.svg" alt="">
              </div>
            </div>
          </div>

          <div class="panel timepanel">
          <div class="time-controls">
            <label class="cal-label">
              <span data-i18n="calendar">Calendar</span>
              <select id="cal-system">
                <option value="gregory" data-i18n="calGregory">Gregorian</option>
                <option value="islamic-umalqura" data-i18n="calIslamic">Lunar Hijri (Islamic)</option>
                <option value="persian" data-i18n="calPersian">Solar Hijri (Persian)</option>
                <option value="hebrew" data-i18n="calHebrew">Hebrew (Jewish)</option>
                <option value="buddhist" data-i18n="calBuddhist">Buddhist</option>
                <option value="indian" data-i18n="calIndian">Indian (Saka)</option>
                <option value="ethiopic" data-i18n="calEthiopic">Ethiopian</option>
                <option value="coptic" data-i18n="calCoptic">Coptic</option>
              </select>
            </label>
            <button id="cal-today" class="btn" data-i18n="today">Today</button>
          </div>

          <div id="timeline" class="timeline">
            <div id="tl-track" class="tl-track"></div>
          </div>

          <div class="cal">
            <div class="cal-head">
              <div class="cal-levels">
                <button type="button" class="lvl" data-level="millennium" data-i18n="millennia">Millennia</button>
                <button type="button" class="lvl" data-level="century" data-i18n="centuries">Centuries</button>
                <button type="button" class="lvl" data-level="decade" data-i18n="decades">Decades</button>
                <button type="button" class="lvl" data-level="year" data-i18n="years">Years</button>
                <button type="button" class="lvl" data-level="month" data-i18n="months">Months</button>
              </div>
              <div class="cal-nav">
                <button type="button" id="cal-prev" class="nav-btn" aria-label="‹">‹</button>
                <span id="cal-title"></span>
                <button type="button" id="cal-next" class="nav-btn" aria-label="›">›</button>
              </div>
            </div>
            <div id="cal-grid" class="cal-grid"></div>
          </div>
          </div>
        </div>

        <div class="home-search">
          <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.35-4.35"/></svg>
          <input id="home-search" type="search" data-i18n-placeholder="search" placeholder="Search" aria-label="Search">
        </div>

        <div class="categories">
          <button type="button" class="category" data-i18n="catAuthors">Authors</button>
          <button type="button" class="category" data-i18n="catEra">Era / Epoch</button>
          <button type="button" class="category" data-i18n="catAcademic">Academic Fields</button>
          <button type="button" class="category" data-i18n="catGenre">Genre</button>
          <button type="button" class="category" data-i18n="catReligion">Religious / Spiritual</button>
          <button type="button" class="category" data-i18n="catLanguage">Language</button>
        </div>

        <!-- Full-screen map viewer (zoom + pan; drift is paused while open) -->
        <div id="map-viewer" class="map-viewer" hidden>
          <div class="map-viewer-bar">
            <button type="button" id="map-zoom-out" class="map-tool" data-i18n-title="zoomOut" data-i18n-aria="zoomOut" title="Zoom out" aria-label="Zoom out">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3M8 11h6"/></svg>
            </button>
            <button type="button" id="map-zoom-in" class="map-tool" data-i18n-title="zoomIn" data-i18n-aria="zoomIn" title="Zoom in" aria-label="Zoom in">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3M11 8v6M8 11h6"/></svg>
            </button>
            <button type="button" id="map-collapse" class="map-tool" data-i18n-title="shrink" data-i18n-aria="shrink" title="Shrink" aria-label="Shrink">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 20v-5h5M15 9l6-6M9 15l-6 6"/></svg>
            </button>
          </div>
          <div id="map-stage" class="map-viewer-stage">
            <img id="map-full" class="map-full" src="assets/world-map.svg" alt="">
          </div>
        </div>
      </section>

      <!-- Account -->
      <section id="account" hidden>
        <div class="card">
          <h2 data-i18n="account">Account</h2>

          <form id="signin-form">
            <label>
              <span data-i18n="name">Name</span>
              <input id="acc-name" type="text" required autocomplete="name">
            </label>
            <label>
              <span data-i18n="email">Email</span>
              <input id="acc-email" type="email" required autocomplete="email">
            </label>
            <button type="submit" class="btn btn-primary" data-i18n="signIn">Sign in</button>
          </form>

          <div id="signed-in" hidden>
            <p><span data-i18n="welcome">Welcome</span>, <strong id="acc-display"></strong></p>
            <label class="setting">
              <span data-i18n="theme">Theme</span>
              <select id="theme-select">
                <option value="system" data-i18n="themeSystem">System</option>
                <option value="light" data-i18n="themeLight">Light</option>
                <option value="dark" data-i18n="themeDark">Dark</option>
              </select>
            </label>
            <button id="signout-btn" class="btn" data-i18n="signOut">Sign out</button>
          </div>

          <button id="back-btn" class="btn btn-ghost" data-i18n="back">Back</button>
        </div>
      </section>

      <!-- Footer pages (blank for now) -->
      <section id="about" class="page" hidden>
        <h1 class="page-title" data-i18n="about">About</h1>
      </section>
      <section id="privacy" class="page" hidden>
        <h1 class="page-title" data-i18n="privacyPolicy">Privacy Policy</h1>
      </section>
      <section id="terms" class="page" hidden>
        <h1 class="page-title" data-i18n="termsOfUse">Terms of Use</h1>
      </section>
      <section id="app" class="page" hidden>
        <h1 class="page-title" data-i18n="app">App</h1>
      </section>
      <section id="legal" class="page" hidden>
        <h1 class="page-title" data-i18n="legal">Legal</h1>
      </section>
    </main>

    <footer class="site-footer">
      <span class="copyright">© <span id="copyright-year">2026</span> MOUSEION. <span data-i18n="rightsReserved">All rights reserved.</span></span>
      <nav class="footer-links">
        <a href="#/about" data-i18n="about">About</a>
        <a href="#/privacy" data-i18n="privacyPolicy">Privacy Policy</a>
        <a href="#/terms" data-i18n="termsOfUse">Terms of Use</a>
        <a href="#/app" data-i18n="app">App</a>
        <a href="#/legal" data-i18n="legal">Legal</a>
      </nav>
    </footer>
  </div>

  <script src="js/languages.js?v=17"></script>
  <script src="js/i18n.js?v=17"></script>
  <script src="js/timecal.js?v=17"></script>
  <script src="js/mapviewer.js?v=17"></script>
  <script src="js/app.js?v=17"></script>
</body>
</html>
